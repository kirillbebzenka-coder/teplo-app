name: Validate TEPLO JavaScript
on: [push, pull_request]
jobs:
  syntax-and-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-js.mjs
      - run: node tests/dispatcher-attention.test.mjs
      - run: node tests/checkout-network.test.mjs
      - run: node tests/courier-workspace.test.mjs
      - run: node tests/courier-controller.test.mjs
      - run: node tests/delivery-timer.test.mjs
      - run: node tests/dispatcher-board.test.mjs
      - run: node tests/dispatcher-controller.test.mjs
      - run: node tests/buyer-storefront.test.mjs
      - run: node tests/buyer-role-navigation.test.mjs
      - run: node tests/customer-comment.test.mjs
      - run: node tests/courier-card.test.mjs
