<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEPLO · Витрина для гостей</title><style>*{box-sizing:border-box}body{margin:0;background:#08070c;color:#f6f1f8;font:15px system-ui}main{display:grid;grid-template-columns:300px 390px;gap:50px;justify-content:center;align-items:start;padding:28px 20px}h1{font-size:35px;line-height:1.17;letter-spacing:-.045em;margin-top:55px}p{color:#b7a9c2;line-height:1.6}a{color:#f279c4;display:block;margin:25px 0}iframe{width:390px;height:844px;border:1px solid #4a3357;border-radius:26px;background:#08070c}select{padding:10px;background:#21162b;color:white;border:1px solid #765285;border-radius:10px;width:100%}@media(max-width:800px){main{display:block;padding:14px}aside{display:none}iframe{width:100%;height:calc(100dvh - 28px);border-radius:18px}}</style></head><body><main><aside><p>TEPLO · ДЛЯ ПОКУПАТЕЛЕЙ</p><h1>Весь выбор.<br>Сразу перед тобой.</h1><p>Компактная сетка заведений, быстрый поиск и одна общая корзина. Меню открывается без входа.</p><p>Только тестовые магазины и превью. Реальные заказы и оплата отключены.</p><label for="phoneSize">Экран телефона</label><select id="phoneSize"><option value="390">390 × 844</option><option value="320">320 × 667</option></select><a href="./?v=73">Открыть приложение</a></aside><iframe title="TEPLO — приложение для гостей" src="./?v=73"></iframe></main><script>document.getElementById('phoneSize').onchange=event=>{const small=event.target.value==='320',frame=document.querySelector('iframe');frame.style.width=small?'320px':'390px';frame.style.height=small?'667px':'844px';};</script></body></html>
